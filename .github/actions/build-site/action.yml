name: Build and check the site
description: The same installation, build and checks used locally by npm test.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: npm ci
      shell: bash
    - run: npm test
      shell: bash
