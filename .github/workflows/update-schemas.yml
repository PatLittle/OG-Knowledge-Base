name: Refresh CKAN schemas
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_schemas.py
      - content/schemas/config.json
      - .github/workflows/update-schemas.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Discover schema types and fetch complete definitions
        run: python scripts/fetch_schemas.py
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit snapshots and generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/schemas/snapshots data en fr sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CKAN schema discovery and metadata definitions"
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN commits do not trigger the push deployment workflow.
      # Deploy this verified build directly so scheduled updates always go live.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy refreshed reference pages
        id: deployment
        uses: actions/deploy-pages@v4
