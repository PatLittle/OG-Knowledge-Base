name: Refresh CKAN schemas
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_schemas.py
      - content/schemas/config.json
      - .github/workflows/update-schemas.yml
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover schema types and fetch complete definitions
        run: python3 scripts/fetch_schemas.py
      - uses: ./.github/actions/build-site
      - name: Commit source snapshots only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/schemas/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Refresh CKAN schema discovery and metadata definitions"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A GITHUB_TOKEN commit does not trigger pages.yml; publish this tested artifact.
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: dist
  deploy:
    if: needs.refresh.outputs.changed == 'true'
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy refreshed reference pages
        id: deployment
        uses: actions/deploy-pages@v4
